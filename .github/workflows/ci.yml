name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix size: Windows/macOS only run on the newest & oldest Pythons
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run offline unit tests
        env:
          AIDETECT_OFFLINE: "1"
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test (local-only, no network)
        run: |
          ai-detect --list-engines
          ai-detect --local-only --threshold 100 tests/samples/ai_sample.txt
          ai-detect --local-only --json tests/samples/human_sample.txt
          ai-detect --batch tests/samples --local-only --threshold 100

      - name: Verify HTML + JSON exports
        shell: bash
        run: |
          ai-detect --local-only --threshold 100 --export report.html tests/samples/ai_sample.txt
          ai-detect --local-only --threshold 100 --export report.json tests/samples/ai_sample.txt
          python -c "import json; json.load(open('report.json'))"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ai_detector_cli/

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
