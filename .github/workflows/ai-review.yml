name: AI Code Review

# Provider-agnostic AI review of pull requests. Uses whichever AI is
# available, tried in this order:
#   1. agy CLI installed on the runner     -> local `agy` (zero secrets needed)
#   2. claude CLI installed on the runner  -> local `claude -p` (zero secrets needed)
#   3. ANTHROPIC_API_KEY secret            -> installs Claude Code CLI, `claude -p`
#   4. GEMINI_API_KEY secret               -> Google Gemini REST API (free tier is enough)
#   5. OPENAI_API_KEY secret               -> OpenAI chat completions API
# Self-hosted runners / local `act` runs pick up an installed CLI automatically;
# GitHub-hosted runners fall back to whichever secret is configured.
# With none available the job exits green with a notice — PRs never fail.
# Optional repo *variables* to pin models: AGY_MODEL, CLAUDE_MODEL, GEMINI_MODEL, OPENAI_MODEL.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Intentionally PR-only: the review's automatic output is a PR comment, and
  # that is the only surface it can post to without extra approvals. Branch /
  # push events are deliberately NOT reviewed — when the workflow cannot post
  # its result automatically, it does not run at all (no noisy no-op runs).

permissions:
  contents: read # read repo + PR diff
  pull-requests: write # post / update the review comment

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true # one review per PR, superseded pushes cancel

jobs:
  review:
    name: AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Fork PRs never receive repository secrets, so skip them entirely.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGY_MODEL: ${{ vars.AGY_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

    steps:
      - name: Checkout (full history, needed for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the AI provider (first available wins)
        id: provider
        run: |
          if command -v agy >/dev/null 2>&1; then
            # Locally installed agy CLI — already authenticated on this machine.
            provider=agy
            model="${AGY_MODEL:-local agy}"
          elif command -v claude >/dev/null 2>&1; then
            # Locally installed Claude Code CLI — already authenticated on this machine.
            provider=claude-local
            model="${CLAUDE_MODEL:-local claude}"
          elif [ -n "${ANTHROPIC_API_KEY}" ]; then
            provider=claude
            model="${CLAUDE_MODEL:-claude CLI default}"
          elif [ -n "${GEMINI_API_KEY}" ]; then
            provider=gemini
            model="${GEMINI_MODEL:-gemini-2.5-flash}"
          elif [ -n "${OPENAI_API_KEY}" ]; then
            provider=openai
            model="${OPENAI_MODEL:-gpt-4o-mini}"
          else
            echo "::notice::No AI provider available — install the agy or Claude Code CLI on the runner (used automatically, zero secrets), or add ONE repo secret: ANTHROPIC_API_KEY (Claude via 'claude -p') or GEMINI_API_KEY (Gemini free tier, key: https://aistudio.google.com) or OPENAI_API_KEY (OpenAI)."
            provider=none
            model=none
          fi
          echo "provider=${provider}" >> "$GITHUB_OUTPUT"
          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "PROVIDER=${provider}" >> "$GITHUB_ENV"

      - name: Collect PR diff and build the review prompt
        id: diff
        if: steps.provider.outputs.provider != 'none'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # fetch-depth: 0 already includes it in most cases; fetch defensively.
          git fetch origin "$base" --depth=1 || true
          if ! git diff "$base...HEAD" > /tmp/pr.diff 2>/dev/null; then
            # Fallback: diff against the merge-base of the target branch.
            git diff "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" HEAD > /tmp/pr.diff || true
          fi
          if [ ! -s /tmp/pr.diff ]; then
            echo "::notice::PR diff is empty — nothing for the AI to review."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          max_bytes=60000
          size=$(wc -c < /tmp/pr.diff)
          if [ "$size" -gt "$max_bytes" ]; then
            head -c "$max_bytes" /tmp/pr.diff > /tmp/pr_final.diff
            echo "DIFF_TRUNCATED=1" >> "$GITHUB_ENV"
            echo "::notice::Diff is $size bytes — truncated to $max_bytes bytes for the review prompt."
          else
            cp /tmp/pr.diff /tmp/pr_final.diff
            echo "DIFF_TRUNCATED=0" >> "$GITHUB_ENV"
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"

          # Build the shared review prompt, plus a provider-specific request
          # payload for the REST providers (claude reads the prompt via stdin).
          python3 - <<'PY'
          import json
          import os

          diff = open("/tmp/pr_final.diff", encoding="utf-8", errors="replace").read()
          truncated = os.environ.get("DIFF_TRUNCATED") == "1"
          pr_title = os.environ.get("PR_TITLE", "")
          pr_number = os.environ.get("PR_NUMBER", "?")
          provider = os.environ.get("PROVIDER", "")

          note = (
              "\nNote: the diff was truncated to 60000 bytes — review only the visible portion.\n"
              if truncated
              else ""
          )
          prompt = (
              "You are an expert code reviewer reviewing a GitHub pull request.\n\n"
              f"Repository: {os.environ.get('GITHUB_REPOSITORY', '')} — PR #{pr_number}: {pr_title}\n"
              f"{note}\n"
              "Focus on, in priority order:\n"
              "1. Correctness bugs (logic errors, edge cases, off-by-one, race conditions)\n"
              "2. Security issues (injection, unsafe deserialization, leaked secrets, path traversal)\n"
              "3. Breaking API or behavior changes\n"
              "4. Missing tests for new or changed behavior\n\n"
              "Guidelines:\n"
              "- Infer the programming language(s) and framework(s) from the diff and review idiomatically for them.\n"
              "- Be concise; use markdown; cite files/lines when pointing at a problem.\n"
              "- Ignore pure style nits (formatting, naming taste, import order).\n"
              '- If nothing significant is found, reply exactly: "LGTM — no significant issues found."\n\n'
              "Diff (unified format):\n\n"
              + diff
          )
          with open("/tmp/review_prompt.txt", "w", encoding="utf-8") as f:
              f.write(prompt)

          if provider == "gemini":
              with open("payload.json", "w", encoding="utf-8") as f:
                  json.dump({"contents": [{"parts": [{"text": prompt}]}]}, f)
          elif provider == "openai":
              model = os.environ.get("OPENAI_MODEL") or "gpt-4o-mini"
              with open("payload.json", "w", encoding="utf-8") as f:
                  json.dump({"model": model, "messages": [{"role": "user", "content": prompt}]}, f)
          PY

      - name: Ask the AI to review the diff
        id: ai
        if: steps.provider.outputs.provider != 'none' && steps.diff.outputs.empty != 'true'
        run: |
          set +e # provider hiccups must never fail the PR

          case "$PROVIDER" in
            agy)
              # Local agy CLI — reads the prompt on stdin, writes the review to stdout.
              timeout 480 agy < /tmp/review_prompt.txt > review.md 2> agy_err.txt
              rc=$?
              if [ "${rc}" -ne 0 ] || [ ! -s review.md ]; then
                echo "::warning::Local agy CLI review failed (exit ${rc}). Skipping review — the PR is unaffected."
                head -c 1000 agy_err.txt 2>/dev/null || true
                exit 0
              fi
              ;;

            claude-local)
              # Local Claude Code CLI in print mode — already installed and authenticated.
              model_args=()
              if [ -n "${CLAUDE_MODEL}" ]; then model_args=(--model "${CLAUDE_MODEL}"); fi
              timeout 480 claude -p --output-format text "${model_args[@]}" \
                < /tmp/review_prompt.txt > review.md 2> claude_err.txt
              rc=$?
              if [ "${rc}" -ne 0 ] || [ ! -s review.md ]; then
                echo "::warning::Local Claude CLI review failed (exit ${rc}). Skipping review — the PR is unaffected."
                head -c 1000 claude_err.txt 2>/dev/null || true
                exit 0
              fi
              ;;

            gemini)
              # Google Gemini — plain REST call, free tier is enough.
              http_code=$(curl -sS -o response.json -w '%{http_code}' \
                "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL:-gemini-2.5-flash}:generateContent" \
                -H 'Content-Type: application/json' \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -d @payload.json)
              if [ "${http_code}" != "200" ] || [ ! -s response.json ]; then
                echo "::warning::Gemini API request failed (HTTP ${http_code:-network error}). Skipping review — the PR is unaffected."
                head -c 2000 response.json 2>/dev/null || true
                exit 0
              fi
              ;;

            claude)
              # Claude Code CLI in print mode — authenticates via ANTHROPIC_API_KEY.
              npm install -g --silent @anthropic-ai/claude-code \
                || { echo "::warning::Could not install the Claude Code CLI. Skipping review — the PR is unaffected."; exit 0; }
              model_args=()
              if [ -n "${CLAUDE_MODEL}" ]; then model_args=(--model "${CLAUDE_MODEL}"); fi
              timeout 480 claude -p --output-format text "${model_args[@]}" \
                < /tmp/review_prompt.txt > review.md 2> claude_err.txt
              rc=$?
              if [ "${rc}" -ne 0 ] || [ ! -s review.md ]; then
                echo "::warning::Claude CLI review failed (exit ${rc}). Skipping review — the PR is unaffected."
                head -c 1000 claude_err.txt 2>/dev/null || true
                exit 0
              fi
              ;;

            openai)
              # OpenAI chat completions — plain REST call.
              http_code=$(curl -sS -o response.json -w '%{http_code}' \
                "https://api.openai.com/v1/chat/completions" \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${OPENAI_API_KEY}" \
                -d @payload.json)
              if [ "${http_code}" != "200" ] || [ ! -s response.json ]; then
                echo "::warning::OpenAI API request failed (HTTP ${http_code:-network error}). Skipping review — the PR is unaffected."
                head -c 2000 response.json 2>/dev/null || true
                exit 0
              fi
              ;;
          esac

      - name: Extract the review markdown
        id: extract
        if: steps.provider.outputs.provider != 'none' && steps.diff.outputs.empty != 'true'
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os

          provider = os.environ.get("PROVIDER", "")

          if provider in ("agy", "claude", "claude-local"):
              # The CLI already wrote plain markdown to review.md.
              text = open("review.md", encoding="utf-8", errors="replace").read().strip()
          else:
              resp = json.load(open("response.json", encoding="utf-8"))
              if provider == "gemini":
                  parts = (resp.get("candidates") or [{}])[0].get("content", {}).get("parts", [])
                  text = "".join(p.get("text", "") for p in parts).strip()
              else:  # openai
                  text = (resp.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()

          if not text:
              raise SystemExit(3)
          with open("review.md", "w", encoding="utf-8") as f:
              f.write(text[:40000])
          PY
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::Could not extract the AI review (provider ${PROVIDER}). Skipping — the PR is unaffected."
            exit 0
          fi

      - name: Post / update PR review comment
        if: steps.provider.outputs.provider != 'none' && steps.diff.outputs.empty != 'true'
        run: |
          if [ ! -s review.md ]; then
            echo "No review content (AI step skipped or failed) — nothing to post."
            exit 0
          fi
          provider='${{ steps.provider.outputs.provider }}'
          model='${{ steps.provider.outputs.model }}'
          marker='<!-- ai-review -->'
          repo="${{ github.repository }}"
          num="${{ github.event.pull_request.number }}"

          body_file=/tmp/ai_comment.md
          {
            echo "$marker"
            echo ""
            echo "## 🤖 AI Code Review"
            echo ""
            echo "_Provider: \`${provider}\` · model: \`${model}\` · updated automatically on each push to this PR_"
            echo ""
            cat review.md
            echo ""
            echo "<sub>Automated review — may contain mistakes. Uses a locally installed agy / Claude Code CLI when present, otherwise the ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY secret. Repo variables AGY_MODEL / CLAUDE_MODEL / GEMINI_MODEL / OPENAI_MODEL pin models.</sub>"
          } > "$body_file"

          # Wrap the markdown body as a JSON request body (no jq dependency).
          python3 - <<'PY'
          import json

          body = open("/tmp/ai_comment.md", encoding="utf-8").read()
          with open("/tmp/ai_comment.json", "w", encoding="utf-8") as f:
              json.dump({"body": body}, f)
          PY

          # Find an existing comment that starts with the marker (gh's built-in --jq).
          comment_id=$(gh api "repos/${repo}/issues/${num}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ai-review -->")) | .id' 2>/dev/null \
            | sort -n | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${repo}/issues/${num}/comments/${comment_id}" \
              --input /tmp/ai_comment.json --silent
            echo "::notice::Updated existing AI review comment (id ${comment_id})."
          else
            gh api -X POST "repos/${repo}/issues/${num}/comments" \
              --input /tmp/ai_comment.json --silent
            echo "::notice::Posted new AI review comment."
          fi

          {
            echo "## 🤖 AI Code Review"
            echo ""
            echo "_Provider: \`${provider}\` · model: \`${model}\`_"
            echo ""
            cat review.md
          } >> "$GITHUB_STEP_SUMMARY"
