name: Gemini AI Code Review

# AI code review of pull requests using the Gemini API (free tier is enough).
# Requires the GEMINI_API_KEY repository secret (free key: aistudio.google.com).
# Without the secret the job exits gracefully with a notice — PRs never fail.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read # read repo + PR diff
  pull-requests: write # post / update the review comment

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true # one review per PR, superseded pushes cancel

jobs:
  review:
    name: Gemini Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs never receive repository secrets, so skip them entirely.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional: set a repo *variable* GEMINI_MODEL to override the model.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

    steps:
      - name: Checkout (full history, needed for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — require GEMINI_API_KEY secret
        id: guard
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::notice::Set the GEMINI_API_KEY repo secret to enable Gemini AI review (Settings → Secrets and variables → Actions → New repository secret). Free keys: https://aistudio.google.com"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect PR diff
        id: diff
        if: steps.guard.outputs.skip != 'true'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # fetch-depth: 0 already includes it in most cases; fetch defensively.
          git fetch origin "$base" --depth=1 || true
          if ! git diff "$base...HEAD" > /tmp/pr.diff 2>/dev/null; then
            # Fallback: diff against the merge-base of the target branch.
            git diff "$(git merge-base "origin/${{ github.base_ref }}" HEAD)" HEAD > /tmp/pr.diff || true
          fi
          if [ ! -s /tmp/pr.diff ]; then
            echo "::notice::PR diff is empty — nothing for Gemini to review."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          max_bytes=60000
          size=$(wc -c < /tmp/pr.diff)
          if [ "$size" -gt "$max_bytes" ]; then
            head -c "$max_bytes" /tmp/pr.diff > /tmp/pr_final.diff
            echo "DIFF_TRUNCATED=1" >> "$GITHUB_ENV"
            echo "::notice::Diff is $size bytes — truncated to $max_bytes bytes for the review prompt."
          else
            cp /tmp/pr.diff /tmp/pr_final.diff
            echo "DIFF_TRUNCATED=0" >> "$GITHUB_ENV"
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Ask Gemini to review the diff
        id: gemini
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e # API hiccups must never fail the PR

          model="${GEMINI_MODEL:-gemini-2.5-flash}"
          echo "model=$model" >> "$GITHUB_OUTPUT"

          # Build the request payload with python3 (no jq dependency).
          python3 - <<'PY'
          import json
          import os

          model = os.environ.get("GEMINI_MODEL") or "gemini-2.5-flash"
          diff = open("/tmp/pr_final.diff", encoding="utf-8", errors="replace").read()
          truncated = os.environ.get("DIFF_TRUNCATED") == "1"
          pr_title = os.environ.get("PR_TITLE", "")
          pr_number = os.environ.get("PR_NUMBER", "?")

          note = (
              "\nNote: the diff was truncated to 60000 bytes — review only the visible portion.\n"
              if truncated
              else ""
          )
          prompt = (
              "You are an expert code reviewer reviewing a GitHub pull request.\n\n"
              f"Repository: {os.environ.get('GITHUB_REPOSITORY', '')} — PR #{pr_number}: {pr_title}\n"
              f"{note}\n"
              "Focus on, in priority order:\n"
              "1. Correctness bugs (logic errors, edge cases, off-by-one, race conditions)\n"
              "2. Security issues (injection, unsafe deserialization, leaked secrets, path traversal)\n"
              "3. Breaking API or behavior changes\n"
              "4. Missing tests for new or changed behavior\n\n"
              "Guidelines:\n"
              "- Infer the programming language(s) and framework(s) from the diff and review idiomatically for them.\n"
              "- Be concise; use markdown; cite files/lines when pointing at a problem.\n"
              "- Ignore pure style nits (formatting, naming taste, import order).\n"
              '- If nothing significant is found, reply exactly: "LGTM — no significant issues found."\n\n'
              "Diff (unified format):\n\n"
              + diff
          )
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump({"contents": [{"parts": [{"text": prompt}]}]}, f)
          PY

          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -d @payload.json)
          if [ "${http_code}" != "200" ] || [ ! -s response.json ]; then
            echo "::warning::Gemini API request failed (HTTP ${http_code:-network error}). Skipping review — the PR is unaffected."
            head -c 2000 response.json 2>/dev/null || true
            exit 0
          fi

          python3 - <<'PY' || { echo "::warning::Could not parse the Gemini response. Skipping review."; exit 0; }
          import json

          resp = json.load(open("response.json", encoding="utf-8"))
          parts = (resp.get("candidates") or [{}])[0].get("content", {}).get("parts", [])
          text = "".join(p.get("text", "") for p in parts).strip()
          if not text:
              raise SystemExit(3)
          open("review.md", "w", encoding="utf-8").write(text[:40000])
          PY

          if [ ! -s review.md ]; then
            echo "::warning::Gemini returned an empty review. Skipping."
            exit 0
          fi

      - name: Post / update PR review comment
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.empty != 'true'
        run: |
          if [ ! -s review.md ]; then
            echo "No review content (Gemini step skipped or failed) — nothing to post."
            exit 0
          fi
          model="${GEMINI_MODEL:-gemini-2.5-flash}"
          marker='<!-- gemini-review -->'
          repo="${{ github.repository }}"
          num="${{ github.event.pull_request.number }}"

          body_file=/tmp/gemini_comment.md
          {
            echo "$marker"
            echo ""
            echo "## 🤖 Gemini AI Code Review"
            echo ""
            echo "_Model: \`${model}\` · updated automatically on each push to this PR_"
            echo ""
            cat review.md
            echo ""
            echo "<sub>Automated review — may contain mistakes. Set the \`GEMINI_MODEL\` repo variable to change models.</sub>"
          } > "$body_file"

          # Wrap the markdown body as a JSON request body (no jq dependency).
          python3 - <<'PY'
          import json

          body = open("/tmp/gemini_comment.md", encoding="utf-8").read()
          with open("/tmp/gemini_comment.json", "w", encoding="utf-8") as f:
              json.dump({"body": body}, f)
          PY

          # Find an existing comment that starts with the marker (gh's built-in --jq).
          comment_id=$(gh api "repos/${repo}/issues/${num}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- gemini-review -->")) | .id' 2>/dev/null \
            | sort -n | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${repo}/issues/${num}/comments/${comment_id}" \
              --input /tmp/gemini_comment.json --silent
            echo "::notice::Updated existing Gemini review comment (id ${comment_id})."
          else
            gh api -X POST "repos/${repo}/issues/${num}/comments" \
              --input /tmp/gemini_comment.json --silent
            echo "::notice::Posted new Gemini review comment."
          fi

          {
            echo "## 🤖 Gemini AI Code Review"
            echo ""
            echo "_Model: \`${model}\`_"
            echo ""
            cat review.md
          } >> "$GITHUB_STEP_SUMMARY"
