[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector-cli"
version = "1.0.0"
description = "Multi-Engine AI Text Detector CLI Suite with ZeroGPT Cloud Integration, GLTR, Burstiness, and Sentence Extraction"
readme = "README.md"
authors = [{ name = "Research Engineering" }]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
ai-detect = "ai_detector_cli.cli:main"
